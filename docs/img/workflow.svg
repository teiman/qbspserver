<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="330" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- editor -->
  <rect x="24" y="40" width="170" height="92" rx="10" fill="#eef4ff" stroke="#5b8def" stroke-width="2"/>
  <text x="109" y="72" text-anchor="middle" font-size="17" font-weight="600" fill="#1f3b73">Your editor</text>
  <text x="109" y="94" text-anchor="middle" font-size="13" fill="#33415c">TrenchBroom, J.A.C.K.,</text>
  <text x="109" y="112" text-anchor="middle" font-size="13" fill="#33415c">a batch file...</text>

  <!-- qbspreceive -->
  <rect x="300" y="40" width="200" height="92" rx="10" fill="#fff7e6" stroke="#e0a030" stroke-width="2"/>
  <text x="400" y="72" text-anchor="middle" font-size="17" font-weight="600" fill="#6b4300">qbspreceive</text>
  <text x="400" y="94" text-anchor="middle" font-size="13" fill="#5c4a1e">instead of qbsp: asks</text>
  <text x="400" y="112" text-anchor="middle" font-size="13" fill="#5c4a1e">the server, shows its log</text>

  <!-- qbspserver -->
  <rect x="580" y="24" width="216" height="124" rx="10" fill="#e9f7ef" stroke="#2f9e5b" stroke-width="2"/>
  <text x="688" y="56" text-anchor="middle" font-size="17" font-weight="600" fill="#155d33">qbspserver</text>
  <text x="688" y="80" text-anchor="middle" font-size="13" fill="#24543a">stays open in a window,</text>
  <text x="688" y="98" text-anchor="middle" font-size="13" fill="#24543a">remembers your map and</text>
  <text x="688" y="116" text-anchor="middle" font-size="13" fill="#24543a">redoes only what changed</text>

  <path d="M194,86 L294,86" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="244" y="76" text-anchor="middle" font-size="12" fill="#444">1. Compile</text>
  <path d="M500,86 L574,86" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="537" y="76" text-anchor="middle" font-size="12" fill="#444">2. "go!"</text>

  <!-- bsp -->
  <rect x="580" y="208" width="216" height="70" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="688" y="238" text-anchor="middle" font-size="17" font-weight="600" fill="#24292f">mymap.bsp</text>
  <text x="688" y="260" text-anchor="middle" font-size="13" fill="#424a53">next to mymap.map</text>
  <path d="M688,148 L688,202" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="698" y="180" font-size="12" fill="#444">3. seconds later</text>

  <!-- light / vis -->
  <rect x="300" y="208" width="200" height="70" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="400" y="238" text-anchor="middle" font-size="17" font-weight="600" fill="#24292f">light, vis</text>
  <text x="400" y="260" text-anchor="middle" font-size="13" fill="#424a53">as usual (optional)</text>
  <path d="M580,243 L506,243" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- quake -->
  <rect x="24" y="208" width="170" height="70" rx="10" fill="#fdecec" stroke="#cf4b4b" stroke-width="2"/>
  <text x="109" y="238" text-anchor="middle" font-size="17" font-weight="600" fill="#7a1f1f">Quake</text>
  <text x="109" y="260" text-anchor="middle" font-size="13" fill="#5c2b2b">play your map</text>
  <path d="M300,243 L200,243" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="410" y="314" text-anchor="middle" font-size="13" fill="#57606a">Start qbspserver once. After that, every compile goes through it and only redoes what you changed.</text>
</svg>
