<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="300" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" font-size="16" font-weight="600" fill="#24292f">The qbsp step in four test compiles of a mid-sized map (e3m4, 3,400 brushes)</text>
  <text x="24" y="54" font-size="12" fill="#57606a">The length of each bar is the time qbsp takes. vis and light take the same time either way.</text>

  <!-- plain qbsp row: 8.7 s each = 157 px -->
  <text x="24" y="104" font-size="14" font-weight="600" fill="#7a1f1f">plain qbsp</text>
  <text x="24" y="122" font-size="12" fill="#57606a">starts from zero</text>
  <text x="24" y="138" font-size="12" fill="#57606a">every time</text>
  <rect x="140" y="88" width="157" height="34" rx="5" fill="#f2b8b5"/>
  <text x="218" y="110" text-anchor="middle" font-size="12" fill="#5c1f1f">8.7 s</text>
  <rect x="301" y="88" width="157" height="34" rx="5" fill="#f2b8b5"/>
  <text x="379" y="110" text-anchor="middle" font-size="12" fill="#5c1f1f">8.7 s</text>
  <rect x="462" y="88" width="157" height="34" rx="5" fill="#f2b8b5"/>
  <text x="540" y="110" text-anchor="middle" font-size="12" fill="#5c1f1f">8.7 s</text>
  <rect x="623" y="88" width="157" height="34" rx="5" fill="#f2b8b5"/>
  <text x="701" y="110" text-anchor="middle" font-size="12" fill="#5c1f1f">8.7 s</text>
  <text x="790" y="146" text-anchor="end" font-size="13" font-weight="600" fill="#7a1f1f">35 s in qbsp</text>

  <!-- qbspserver row: first 8 s (144 px), then 0.65, 1.3, 0.25 s -->
  <text x="24" y="196" font-size="14" font-weight="600" fill="#155d33">qbspserver</text>
  <text x="24" y="214" font-size="12" fill="#57606a">remembers</text>
  <text x="24" y="230" font-size="12" fill="#57606a">the map</text>
  <rect x="140" y="180" width="144" height="34" rx="5" fill="#b9e4c9"/>
  <text x="212" y="202" text-anchor="middle" font-size="12" fill="#155d33">start: 8 s, once</text>
  <rect x="290" y="180" width="12" height="34" rx="3" fill="#2f9e5b"/>
  <rect x="308" y="180" width="23" height="34" rx="3" fill="#2f9e5b"/>
  <rect x="337" y="180" width="5" height="34" rx="2" fill="#2f9e5b"/>
  <text x="296" y="234" text-anchor="middle" font-size="11" fill="#24543a">0.65 s</text>
  <text x="296" y="248" text-anchor="middle" font-size="11" fill="#57606a">texture</text>
  <text x="326" y="264" text-anchor="middle" font-size="11" fill="#24543a">1.3 s</text>
  <text x="326" y="278" text-anchor="middle" font-size="11" fill="#57606a">brush moved</text>
  <text x="378" y="234" text-anchor="start" font-size="11" fill="#24543a">0.25 s: light moved</text>
  <line x1="340" y1="216" x2="374" y2="230" stroke="#8c959f"/>
  <text x="790" y="232" text-anchor="end" font-size="13" font-weight="600" fill="#155d33">after the start:</text>
  <text x="790" y="250" text-anchor="end" font-size="13" font-weight="600" fill="#155d33">about 2 s for all three</text>
</svg>
